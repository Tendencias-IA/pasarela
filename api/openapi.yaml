openapi: 3.1.0
info:
  title: Pasarela API
  description: >
    Contrato de la API de la billetera digital (prototipo académico). Fuente de verdad
    para la API y la webapp (ver .claude/rules/api-design.md). Los endpoints se añaden
    aquí en la misma tarea que los implementa.
  version: "0.1.0"
servers:
  - url: /
paths:
  /api/v1/wallet:
    get:
      operationId: getWallet
      summary: Saldo disponible de la billetera del usuario autenticado (HU-05)
      tags: [wallet]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Saldo persistido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletOut"
              examples:
                saldo:
                  value: { balance: "150000.00" }
        "401":
          description: Sin sesión válida (code `invalid_session`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: La cuenta no tiene billetera (code `wallet_not_found`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/wallet/recharges:
    post:
      operationId: createRecharge
      summary: Acreditar una recarga simulada en la billetera del usuario autenticado (HU-08)
      tags: [wallet]
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID v4 generado por la webapp por intento; repetirlo reproduce la respuesta original.
          schema:
            type: string
            format: uuid
        - name: X-Requested-With
          in: header
          required: true
          schema:
            type: string
            enum: [fetch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechargeIn"
            examples:
              valida:
                value: { amount: "50000.00" }
      responses:
        "201":
          description: Recarga aplicada (o reproducida si la clave ya existía; ver cabecera Idempotent-Replayed)
          headers:
            Idempotent-Replayed:
              description: Presente con valor "true" cuando la respuesta se reprodujo desde una solicitud anterior.
              schema: { type: string, enum: ["true"] }
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOut"
              examples:
                exitosa:
                  value:
                    id: 8812
                    type: recarga
                    status: exitosa
                    amount: "50000.00"
                    balance_after: "50000.00"
                    created_at: "2026-10-14T21:40:00Z"
        "400":
          description: Falta la cabecera Idempotency-Key o no es un UUID (code `missing_idempotency_key`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: Sin sesión válida (code `invalid_session`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Falta X-Requested-With (code `missing_requested_with`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: El usuario no tiene billetera (code `wallet_not_found`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >
            Monto inválido en formato (code `validation`, con `errors[]`), fuera de rango
            (code `amount_out_of_range`) o misma Idempotency-Key con cuerpo distinto
            (code `idempotency_key_mismatch`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                fuera_de_rango:
                  value:
                    type: https://pasarela.local/problems/amount_out_of_range
                    title: Monto fuera de rango
                    status: 422
                    detail: El monto debe estar entre 5000.00 y 5000000.00 COP.
                    instance: /api/v1/wallet/recharges
                    code: amount_out_of_range
                    request_id: 7f1c9b2e
                    errors: [{ field: amount, message: "Debe estar entre 5000.00 y 5000000.00" }]
  /api/v1/movements:
    get:
      operationId: listMovements
      summary: Historial paginado de movimientos de la billetera del usuario autenticado (HU-09)
      tags: [movements]
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página desde 1. Página inexistente responde items vacío con el total real.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: from
          in: query
          required: false
          description: Fecha inicial AAAA-MM-DD, inclusiva desde las 00:00:00 UTC. Sin ella el rango queda abierto por el inicio (HU-10 CA-1).
          schema:
            type: string
            format: date
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
            example: "2026-10-01"
        - name: to
          in: query
          required: false
          description: Fecha final AAAA-MM-DD, inclusiva hasta las 23:59:59 UTC. Debe ser igual o posterior a `from` (HU-10 CA-1, CA-2).
          schema:
            type: string
            format: date
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
            example: "2026-10-31"
        - name: type
          in: query
          required: false
          description: >-
            Tipo (HU-10 CA-3). `sent` incluye las transferencias rechazadas del emisor; `received` solo las
            exitosas; `recharge` recargas exitosas y rechazadas. Combinable con `from` y `to` (CA-4).
          schema:
            type: string
            enum: [all, sent, received, recharge]
            default: all
      responses:
        "200":
          description: Página de movimientos (solo los que cumplen los filtros; `total` es el de las coincidencias) ordenados del más reciente al más antiguo (created_at DESC, id DESC)
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementsPageOut"
              examples:
                con_movimientos:
                  value:
                    items:
                      - id: 8813
                        direction: enviada
                        type: transferencia
                        status: exitosa
                        amount: "150000.00"
                        created_at: "2026-10-14T21:42:10Z"
                        rejection_reason: null
                        counterparty: { name_masked: "Mar** G****", phone_masked: "***4567" }
                      - id: 8812
                        direction: recarga
                        type: recarga
                        status: rechazada
                        amount: "4999.00"
                        created_at: "2026-10-14T21:40:00Z"
                        rejection_reason: amount_out_of_range
                        counterparty: null
                    page: 1
                    page_size: 20
                    total: 2
                vacio:
                  value: { items: [], page: 1, page_size: 20, total: 0 }
        "401":
          description: Sin sesión válida (code `invalid_session`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >-
            `validation` si page, from, to o type tienen formato inválido (errors[].field indica cada campo,
            todos a la vez); `invalid_date_range` si from es posterior a to (HU-10 CA-2).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/transfers:
    post:
      operationId: createTransfer
      summary: Confirmar y ejecutar una transferencia desde la billetera del usuario autenticado (HU-07)
      description: >
        Una sola operación atómica: descuenta al emisor, acredita al destinatario y registra el
        movimiento. El servidor revalida sesión, destinatario, monto, límites, titularidad y saldo.
      tags: [transfers]
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID v4 generado por la webapp al mostrar el resumen; repetirlo reproduce la respuesta original.
          schema:
            type: string
            format: uuid
        - name: X-Requested-With
          in: header
          required: true
          schema:
            type: string
            enum: [fetch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferIn"
            examples:
              valida:
                value: { recipient_phone: "3001234567", amount: "150000.00" }
      responses:
        "201":
          description: Transferencia aplicada (o reproducida si la clave ya existía; ver cabecera Idempotent-Replayed)
          headers:
            Idempotent-Replayed:
              description: Presente con valor "true" cuando la respuesta se reprodujo desde una solicitud anterior.
              schema: { type: string, enum: ["true"] }
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferOut"
              examples:
                exitosa:
                  value:
                    id: 8812
                    type: transferencia
                    status: exitosa
                    amount: "150000.00"
                    recipient: { name_masked: "Mar** G****", phone_masked: "***4567" }
                    balance_after: "350000.00"
                    created_at: "2026-10-13T21:40:00Z"
        "400":
          description: Falta la cabecera Idempotency-Key o no es un UUID (code `missing_idempotency_key`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: Sin sesión válida (code `invalid_session`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Falta X-Requested-With (code `missing_requested_with`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Destinatario inexistente o sin billetera (code `recipient_not_found`) o el emisor no tiene billetera (code `wallet_not_found`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Otra solicitud con la misma clave está en curso y aún no hay respuesta para reproducir (code `idempotency_key_in_progress`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >
            Formato inválido (code `validation`), monto fuera de 100.00..3000000.00 (code
            `amount_out_of_range`), destinatario igual al emisor (code `self_transfer`), saldo
            insuficiente (code `insufficient_balance`) o misma Idempotency-Key con cuerpo
            distinto (code `idempotency_key_mismatch`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/transfers/preview:
    post:
      operationId: previewTransfer
      summary: Validar una transferencia y devolver su resumen sin ejecutarla (HU-06)
      description: >
        Consulta pura: no modifica saldos, no crea movimientos ni usa Idempotency-Key
        (HU-06 CA-8). El servidor revalida todo al confirmar (HU-07).
      tags: [transfers]
      security:
        - sessionCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          schema:
            type: string
            enum: [fetch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferIn"
            examples:
              valida:
                value: { recipient_phone: "3001234567", amount: "150000.00" }
      responses:
        "200":
          description: Resumen con el monto, el destinatario enmascarado y el saldo que quedaría
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPreviewOut"
              examples:
                resumen:
                  value:
                    amount: "150000.00"
                    recipient: { name_masked: null, phone_masked: "***4567" }
                    balance_after: "350000.00"
        "401":
          description: Sin sesión válida (code `invalid_session`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Falta X-Requested-With (code `missing_requested_with`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Destinatario inexistente o sin billetera (code `recipient_not_found`) o el emisor no tiene billetera (code `wallet_not_found`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >
            Formato inválido (code `validation`, errors[] con recipient_phone y/o amount),
            monto fuera de 100.00..3000000.00 (code `amount_out_of_range`), destinatario
            igual al emisor (code `self_transfer`) o saldo insuficiente (code `insufficient_balance`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /health:
    get:
      summary: Estado del servicio, sin sesión
      operationId: health
      security: []
      responses:
        "200":
          description: El servicio y la base de datos responden
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  db:
                    type: string
                    enum: [ok]
        "503":
          description: La base de datos no responde
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    enum: [degraded]
                  db:
                    type: string
                    enum: [error]
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Vencimiento de la sesión; la consulta cuenta como actividad (HU-04)
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sesión vigente; la cookie se renueva con el nuevo vencimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOut"
              examples:
                vigente:
                  value: { expires_at: "2026-10-14T21:45:00Z" }
        "401":
          description: Sin sesión, vencida o revocada (code `invalid_session`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión con teléfono y contraseña (HU-02)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginIn"
      responses:
        "204":
          description: Sesión concedida (token en cookie `Set-Cookie`, sin cuerpo)
          headers:
            Set-Cookie:
              schema:
                type: string
        "422":
          description: Teléfono o contraseña con formato inválido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Credenciales incorrectas (mismo cuerpo para teléfono inexistente o contraseña errónea)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Demasiados intentos de inicio de sesión
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/accounts:
    post:
      summary: Registrar una cuenta y su billetera con saldo inicial de $0 COP (HU-01)
      operationId: registerAccount
      security: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          schema:
            type: string
            enum: [fetch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
      responses:
        "201":
          description: Cuenta y billetera creadas de forma atómica, sin iniciar sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAccountResponse"
        "400":
          description: Cuerpo JSON inválido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Teléfono, correo o identificación ya registrados
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Cuerpo superior al límite de 16 KB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Uno o más campos ausentes o inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Error inesperado sin persistencia parcial
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/profile:
    get:
      operationId: getProfile
      summary: Consultar el perfil propio para editar el teléfono
      responses:
        "200":
          description: Perfil propio, sin contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "401":
          description: Sin sesión válida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Perfil no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updatePhone
      summary: Actualizar teléfono o correo propio (HU-12, HU-13)
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          schema:
            type: string
            enum: [fetch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UpdatePhoneRequest"
                - $ref: "#/components/schemas/UpdateEmailRequest"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "401":
          description: Sin sesión válida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Perfil no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Teléfono o correo ya registrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Campo ausente, inválido o no editable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    UpdatePhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          pattern: "^3[0-9]{9}$"
    UpdateEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    AccountProfile:
      type: object
      additionalProperties: false
      required: [full_name, phone, national_id, email]
      properties:
        full_name:
          type: string
          nullable: true
        phone:
          type: string
        national_id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    Money:
      type: string
      description: Monto en COP como cadena decimal con exactamente dos decimales.
      pattern: "^\\d{1,13}\\.\\d{2}$"
      example: "50000.00"
    WalletOut:
      type: object
      required: [balance]
      properties:
        balance: { $ref: "#/components/schemas/Money" }
    RechargeIn:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount:
          type: string
          description: Entre 5000.00 y 5000000.00 inclusive; hasta dos decimales; siempre cadena.
          pattern: "^\\d{1,13}(\\.\\d{1,2})?$"
          example: "50000.00"
    RechargeOut:
      type: object
      required: [id, type, status, amount, balance_after, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [recarga] }
        status: { type: string, enum: [exitosa] }
        amount: { $ref: "#/components/schemas/Money" }
        balance_after: { $ref: "#/components/schemas/Money" }
        created_at: { type: string, format: date-time }
    Counterparty:
      type: object
      description: Otro participante de una transferencia, ya enmascarado en el servidor (RNF-06).
      required: [name_masked, phone_masked]
      properties:
        name_masked:
          type: [string, "null"]
          description: Iniciales con asteriscos ("Mar** G****"); null mientras HU-01 no registre el nombre.
          example: "Mar** G****"
        phone_masked:
          type: string
          pattern: "^\\*{3}\\d{0,4}$"
          example: "***4567"
    MovementOut:
      type: object
      required: [id, direction, type, status, amount, created_at, rejection_reason, counterparty]
      properties:
        id: { type: integer, format: int64 }
        direction:
          type: string
          enum: [recarga, enviada, recibida]
          description: Punto de vista de la billetera del usuario autenticado.
        type: { type: string, enum: [recarga, transferencia] }
        status: { type: string, enum: [exitosa, rechazada] }
        amount: { $ref: "#/components/schemas/Money" }
        created_at: { type: string, format: date-time }
        rejection_reason:
          type: [string, "null"]
          description: Código del motivo cuando status = rechazada.
        counterparty:
          oneOf:
            - $ref: "#/components/schemas/Counterparty"
            - type: "null"
          description: Solo en transferencias; null en recargas.
    MovementsPageOut:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MovementOut" }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, enum: [20] }
        total: { type: integer, minimum: 0 }
    TransferIn:
      type: object
      required: [recipient_phone, amount]
      additionalProperties: false
      properties:
        recipient_phone:
          type: string
          description: Celular del destinatario (diez dígitos, empieza por 3).
          pattern: "^3[0-9]{9}$"
        amount:
          type: string
          description: Entre 100.00 y 3000000.00 inclusive; hasta dos decimales; siempre cadena.
          pattern: "^\\d{1,13}(\\.\\d{1,2})?$"
          example: "150000.00"
    RecipientMasked:
      type: object
      description: Destinatario ya enmascarado en el servidor (RNF-06).
      required: [name_masked, phone_masked]
      properties:
        name_masked:
          type: [string, "null"]
          example: "Mar** G****"
        phone_masked:
          type: string
          pattern: "^\\*{3}\\d{0,4}$"
          example: "***4567"
    TransferPreviewOut:
      type: object
      required: [amount, recipient, balance_after]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        recipient: { $ref: "#/components/schemas/RecipientMasked" }
        balance_after: { $ref: "#/components/schemas/Money" }
    TransferOut:
      type: object
      required: [id, type, status, amount, recipient, balance_after, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [transferencia] }
        status: { type: string, enum: [exitosa] }
        amount: { $ref: "#/components/schemas/Money" }
        recipient: { $ref: "#/components/schemas/RecipientMasked" }
        balance_after: { $ref: "#/components/schemas/Money" }
        created_at: { type: string, format: date-time }
    SessionOut:
      type: object
      required: [expires_at]
      properties:
        expires_at: { type: string, format: date-time }
    LoginIn:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: "^3[0-9]{9}$"
        password:
          type: string
          minLength: 8
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required: [full_name, phone, national_id, email, password]
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[^0-9_]+$"
        phone:
          type: string
          pattern: "^3[0-9]{9}$"
        national_id:
          type: string
          minLength: 5
          maxLength: 20
          pattern: "^[A-Za-z0-9]+$"
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          pattern: "^(?=.*[A-Za-z])(?=.*[0-9]).{8,}$"
          writeOnly: true
    RegisterAccountResponse:
      type: object
      additionalProperties: false
      required: [account_id, wallet]
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 1
        wallet:
          type: object
          additionalProperties: false
          required: [balance]
          properties:
            balance:
              type: string
              enum: ["0.00"]
    Problem:
      type: object
      required: [type, title, status, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
