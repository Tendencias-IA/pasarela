openapi: 3.1.0
info:
  title: Pasarela Accounts API — HU-01
  version: 1.0.0
  description: Contract slice for account registration. It will be merged into api/openapi.yaml during implementation.
paths:
  /api/v1/accounts:
    post:
      operationId: registerAccount
      summary: Register an account and its zero-balance wallet
      tags:
        - accounts
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          description: Same-origin CSRF defense required for mutations.
          schema:
            type: string
            const: fetch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
      responses:
        '201':
          description: Account and wallet created atomically; no session is started.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAccountResponse'
        '400':
          description: The mutation header is missing or the JSON body cannot be parsed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Phone, email or identification is already associated with an account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DuplicateIdentityProblem'
        '413':
          description: Request body exceeds the 16 KB limit.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: One or more required fields are missing or invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '500':
          description: Unexpected error; no account or wallet remains persisted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  headers:
    RequestId:
      description: Correlation id for the request.
      schema:
        type: string
  schemas:
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required:
        - full_name
        - phone
        - national_id
        - email
        - password
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
          pattern: '^[\p{L}\p{M}](?:[\p{L}\p{M} ''-]*[\p{L}\p{M}])?$'
          examples:
            - Ana María O'Neill
        phone:
          type: string
          pattern: '^3[0-9]{9}$'
          examples:
            - '3000000000'
        national_id:
          type: string
          minLength: 5
          maxLength: 20
          pattern: '^[A-Za-z0-9]+$'
          examples:
            - ABC12345
        email:
          type: string
          format: email
          maxLength: 254
          examples:
            - ana@example.test
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain at least one Unicode letter and one ASCII digit.
          pattern: '^(?=.*\p{L})(?=.*[0-9]).{8,}$'
          writeOnly: true
    RegisterAccountResponse:
      type: object
      additionalProperties: false
      required:
        - account_id
        - wallet
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 1
        wallet:
          type: object
          additionalProperties: false
          required:
            - balance
          properties:
            balance:
              type: string
              const: '0.00'
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          enum:
            - full_name
            - phone
            - national_id
            - email
            - password
        message:
          type: string
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            status:
              const: 422
            code:
              const: validation
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'
    DuplicateIdentityProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              const: 409
            code:
              const: duplicate_identity
