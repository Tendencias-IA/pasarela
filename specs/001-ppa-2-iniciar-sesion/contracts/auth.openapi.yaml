openapi: 3.0.3
info:
  title: Pasarela API — auth (HU-02)
  version: "0.1.0"
paths:
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión con teléfono y contraseña
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginIn"
      responses:
        "204":
          description: Sesión concedida (token en cookie `Set-Cookie`, sin cuerpo)
          headers:
            Set-Cookie:
              schema:
                type: string
        "422":
          description: Teléfono o contraseña con formato inválido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Credenciales incorrectas (teléfono inexistente o contraseña errónea; mismo cuerpo en ambos casos)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Demasiados intentos de inicio de sesión
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    LoginIn:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: "^3[0-9]{9}$"
        password:
          type: string
          minLength: 8
    Problem:
      type: object
      required: [type, title, status, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
          nullable: true
