# Fragmento que se fusiona en api/openapi.yaml (path antes de /api/v1/wallet/recharges;
# schema WalletOut tras Money). HU-05.
paths:
  /api/v1/wallet:
    get:
      operationId: getWallet
      summary: Consultar el saldo de la billetera del usuario autenticado (HU-05)
      tags: [wallet]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Saldo disponible de la única billetera del usuario de la sesión (HU-05 CA-1, CA-2)
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletOut"
              examples:
                disponible:
                  value: { balance: "150000.00" }
        "401":
          description: Sin sesión válida (code `invalid_session`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: El usuario no tiene billetera asociada (code `wallet_not_found`); se registra el error técnico (HU-05 CA-5)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    WalletOut:
      type: object
      required: [balance]
      properties:
        balance: { $ref: "#/components/schemas/Money" }
