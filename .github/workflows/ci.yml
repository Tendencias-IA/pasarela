name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Título del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar formato type(PPA-n): descripción
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|build|ci|perf|revert)\((PPA-[0-9]+)(, ?PPA-[0-9]+)*\)!?: [a-záéíóúñ0-9].+'; then
            echo "::error::El título debe ser 'type(PPA-n): descripción en minúscula'. Recibido: $TITLE"
            exit 1
          fi

  secrets:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: Detectar proyectos
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -f backend/pyproject.toml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (ruff, mypy, pytest ≥ 90 %)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: pasarela_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_ENV: testing
      DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/pasarela_test
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Formato y lint
        run: |
          ruff format --check .
          ruff check . --output-format=json -o ruff-report.json || true
          ruff check .
      - name: Tipos
        run: mypy app
      - name: Migraciones
        run: flask db upgrade
      - name: Pruebas y cobertura (falla bajo 90 %)
        run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/ruff-report.json

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  e2e:
    name: E2E Playwright (escritorio y móvil)
    needs: [detect, backend, frontend]
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: pasarela_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/pasarela_e2e
      SECRET_KEY: ci-only-not-a-secret
      FLASK_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: cd backend && flask db upgrade && (gunicorn -b 127.0.0.1:5000 "app:create_app('production')" &)
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  sonar:
    name: SonarQube quality gate
    needs: [detect, backend, frontend]
    if: always() && needs.detect.outputs.backend == 'true' && needs.backend.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports: ["9000:9000"]
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-coverage"
          merge-multiple: false
      - name: Colocar reportes de cobertura
        run: |
          mkdir -p backend frontend/coverage
          cp backend-coverage/coverage.xml backend/ 2>/dev/null || true
          cp backend-coverage/ruff-report.json backend/ 2>/dev/null || true
          cp frontend-coverage/lcov.info frontend/coverage/ 2>/dev/null || true
      - name: Esperar SonarQube y crear token
        id: token
        run: |
          for i in $(seq 1 60); do
            s=$(curl -s http://localhost:9000/api/system/status | sed -n 's/.*"status":"\([A-Z]*\)".*/\1/p')
            [ "$s" = "UP" ] && break; sleep 5
          done
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=CiOnlyPassw0rd!" >/dev/null || true
          TOKEN=$(curl -s -u 'admin:CiOnlyPassw0rd!' -X POST "http://localhost:9000/api/user_tokens/generate?name=ci" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Configurar quality gate "Pasarela"
        env:
          AUTH: "admin:CiOnlyPassw0rd!"
        run: |
          H=http://localhost:9000/api
          curl -s -u "$AUTH" -X POST "$H/qualitygates/create?name=Pasarela" >/dev/null
          for cond in "coverage LT 90" "bugs GT 0" "vulnerabilities GT 0" "security_hotspots_reviewed LT 100" "duplicated_lines_density GT 3" "sqale_rating GT 1" "reliability_rating GT 1" "security_rating GT 1"; do
            set -- $cond
            curl -s -u "$AUTH" -X POST "$H/qualitygates/create_condition?gateName=Pasarela&metric=$1&op=$2&error=$3" >/dev/null
          done
          curl -s -u "$AUTH" -X POST "$H/qualitygates/set_as_default?name=Pasarela" >/dev/null
      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ steps.token.outputs.token }}
          SONAR_HOST_URL: http://localhost:9000

  resultado:
    name: CI verde
    needs: [secrets, backend, frontend, e2e, sonar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que ningún job requerido falló
        run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1 || echo "OK"
