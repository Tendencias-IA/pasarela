# Proyecto único (monorepo) analizado por SonarQube Community.
sonar.projectKey=pasarela
sonar.projectName=Pasarela Billetera Digital
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Fuentes y pruebas
sonar.sources=backend/app,frontend/src
sonar.tests=backend/app,backend/tests,frontend/src,frontend/e2e
sonar.test.inclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.exclusions=**/migrations/**,**/types.gen.ts,**/node_modules/**,**/dist/**,**/coverage/**
sonar.coverage.exclusions=**/migrations/**,**/types.gen.ts,**/conftest.py,**/factories.py,**/fakes.py,frontend/e2e/**

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.ruff.reportPaths=backend/ruff-report.json

# TypeScript
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=frontend/tsconfig.json

# Quality gate: el job de CI espera el resultado del servidor y falla si no es OK.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
