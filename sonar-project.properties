# Proyecto único (monorepo) analizado por SonarQube Community.
sonar.projectKey=pasarela
sonar.projectName=Pasarela Billetera Digital
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Fuentes y pruebas
sonar.sources=api/app,webapp/src
sonar.tests=api/app,api/tests,webapp/src,webapp/e2e
sonar.test.inclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts
# Los patrones de pruebas se excluyen de las fuentes para que main y test no se solapen.
sonar.exclusions=**/migrations/**,**/types.gen.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.coverage.exclusions=**/migrations/**,**/types.gen.ts,**/conftest.py,**/factories.py,**/fakes.py,webapp/e2e/**

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.python.ruff.reportPaths=api/ruff-report.json

# TypeScript
sonar.javascript.lcov.reportPaths=webapp/coverage/lcov.info
sonar.typescript.tsconfigPaths=webapp/tsconfig.json

# Quality gate: el job de CI espera el resultado del servidor y falla si no es OK.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
